<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a777c"><title>OdontoAI | Portal do Paciente</title><style>
:root{--dark:#113842;--muted:#6a8790;--teal:#087f83;--teal2:#086569;--pale:#e8f6f3;--line:#dfebed;--bg:#f5f9fa;--red:#b14c57}*{box-sizing:border-box}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:var(--bg);color:var(--dark)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.wrap{max-width:1040px;margin:0 auto;padding:0 24px}.top{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top .wrap{height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:23px;font-weight:850;letter-spacing:-1.2px;display:flex;align-items:center;gap:10px}.brand b{color:var(--teal)}.mark{width:39px;height:39px;border-radius:12px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:25px}.menu{display:flex;gap:8px}.menu button{border:none;background:transparent;padding:11px 13px;border-radius:10px;color:#617f86;font-size:13px;font-weight:750}.menu button.active{background:#e5f4f2;color:var(--teal)}.hero{background:linear-gradient(125deg,#083b43,#0a797c);color:#fff;border-radius:24px;padding:42px 46px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin:34px 0 25px;overflow:hidden;position:relative}.hero:after{content:'✦';position:absolute;right:12%;top:-80px;font-size:310px;opacity:.055}.hero h1{font-size:34px;letter-spacing:-1.3px;margin:8px 0 12px;line-height:1.14}.hero p{margin:0;max-width:560px;line-height:1.6;color:#d8f0ec}.eyebrow{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;font-weight:800;color:#9ee1d8}.hero-illustration{font-size:100px;filter:drop-shadow(0 16px 15px #0027);z-index:1}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:21px;margin-bottom:26px}.card{border:1px solid var(--line);border-radius:20px;background:white;padding:24px;box-shadow:0 6px 25px #16485007}.card h2{font-size:19px;letter-spacing:-.5px;margin:0 0 7px}.card p{line-height:1.5;color:var(--muted);font-size:14px}.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:21px}.service{background:#fbfdfd;border:1px solid var(--line);border-radius:13px;padding:15px;display:flex;gap:12px;align-items:center}.service .ico{width:41px;height:41px;display:grid;place-items:center;background:var(--pale);border-radius:12px;font-size:22px}.service b{font-size:13px}.service small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.button{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:13px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:750;text-decoration:none}.button:hover{background:var(--teal2)}.button.outline{background:#fff;border:1px solid #cadae0;color:var(--dark)}.button.danger{background:#fff0f1;color:var(--red)}.button.sm{font-size:12px;padding:9px 12px}.button.full{width:100%}.info{background:var(--pale);padding:16px;border-radius:13px;font-size:13px;line-height:1.6;color:#376e71}.mini-info{display:flex;gap:11px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);font-size:13px}.mini-info:last-child{border-bottom:0}.mini-info .i{font-size:20px}.pagehead{margin:31px 0 22px}.pagehead h1{margin:0 0 6px;font-size:30px;letter-spacing:-1px}.pagehead p{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}.fieldgroup{margin:0 0 19px}.fieldgroup label{display:block;font-size:13px;font-weight:750;margin-bottom:8px}.field{border:1px solid #cfdee0;border-radius:11px;padding:12px 13px;width:100%;background:white;color:var(--dark);outline:0}.field:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0c908e17}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}.slot{padding:12px;border:1px solid #cedee0;background:white;color:#345d66;border-radius:11px;font-weight:750}.slot.selected{background:#e4f6f1;color:var(--teal);border:2px solid var(--teal);padding:11px}.summary{position:sticky;top:100px;align-self:start}.summary-row{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13px}.summary-row span:first-child{color:var(--muted)}.summary-row b{text-align:right}.appt{display:flex;align-items:center;gap:15px;padding:18px 0;border-bottom:1px solid var(--line)}.appt:last-child{border:0}.datebox{background:var(--pale);color:var(--teal);border-radius:13px;min-width:70px;display:grid;place-items:center;padding:9px}.datebox strong{font-size:23px}.datebox small{text-transform:uppercase;font-size:11px}.appt-main{flex:1;min-width:0}.appt-main strong{display:block;font-size:14px}.appt-main small{display:block;color:var(--muted);margin-top:5px}.pill{display:inline-block;padding:5px 10px;border-radius:40px;background:#edf0ff;color:#5265a3;font-size:11px;font-weight:750;margin-top:7px}.pill.confirmada{background:#e2f6ed;color:#258253}.pill.cancelada{background:#fff0f1;color:var(--red)}.pill.concluida{background:#e9f1f5;color:#3d8091}.empty{text-align:center;color:var(--muted);padding:50px 10px}.empty .icon{font-size:42px}.form-panel{max-width:580px;margin:0 auto}.toast{position:fixed;bottom:20px;right:20px;background:#143c42;color:#fff;box-shadow:0 12px 32px #0002;padding:15px 20px;border-radius:13px;z-index:10;max-width:min(380px,90vw)}footer{color:#7a979c;font-size:12px;text-align:center;padding:30px 12px 45px}.demo{font-size:12px;background:#fff7e5;border:1px solid #f4e1b1;border-radius:12px;padding:13px 15px;color:#856b37;margin:20px 0}.steps{display:flex;gap:8px;margin-bottom:22px}.step{height:5px;flex:1;background:#e4eded;border-radius:10px}.step.on{background:var(--teal)}@media(max-width:760px){.top .wrap{height:68px}.wrap{padding:0 16px}.menu button{padding:9px 6px;font-size:11px}.brand{font-size:20px}.mark{width:34px;height:34px;font-size:21px}.hero{padding:27px;margin:18px 0}.hero h1{font-size:27px}.hero-illustration{display:none}.grid,.layout{grid-template-columns:1fr}.card{padding:20px}.services{grid-template-columns:1fr}.summary{position:static}.pagehead h1{font-size:25px}.two{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,1fr)}.appt{flex-wrap:wrap}.appt .button{margin-left:auto}}@media(max-width:390px){.menu button{font-size:10px}.brand{font-size:18px}.mark{display:none}}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><span class="mark">✦</span><span>Odonto<b>AI</b></span></div><div class="menu"><button data-tab="inicio" class="active">Início</button><button data-tab="agendar">Agendar</button><button data-tab="consultas">Minhas consultas</button><button data-tab="perfil">Perfil</button></div></div></header>
<main class="wrap" id="app"></main><footer>OdontoAI • Portal do paciente • Protótipo acadêmico offline <div style="margin-top:8px"><a href="clinica.html" style="color:#087f83">Abrir painel da clínica</a></div></footer><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
'use strict';
const DATA_KEY='odontoai-escolar-v1',PROFILE_KEY='odontoai-paciente-demo-v1';
const procedures=[{name:'Avaliação',description:'Primeira consulta',icon:'🦷'},{name:'Limpeza',description:'Prevenção e cuidado',icon:'✨'},{name:'Restauração',description:'Tratamento dental',icon:'✧'},{name:'Clareamento',description:'Estética do sorriso',icon:'☀️'},{name:'Ortodontia',description:'Alinhamento dentário',icon:'◈'},{name:'Retorno',description:'Acompanhamento',icon:'↗'}];
const dateISO=(offset=0)=>{const d=new Date();d.setDate(d.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const formatDate=(s,opts={day:'2-digit',month:'long',year:'numeric'})=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR',opts);
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const digits=s=>String(s??'').replace(/\D/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const read=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const initialData=()=>({clinic:'Clínica Sorriso',patients:[],appointments:[]});
let data=read(DATA_KEY);if(!data||!Array.isArray(data.patients)||!Array.isArray(data.appointments))data=initialData();
let profile=read(PROFILE_KEY)||null,tab='inicio',booking={procedure:'Avaliação',date:dateISO(1),time:''};
function persist(){try{localStorage.setItem(DATA_KEY,JSON.stringify(data));return true}catch{toast('Não foi possível salvar neste navegador.');return false}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3500)}
function go(t){tab=t;document.querySelectorAll('[data-tab]').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));render();window.scrollTo(0,0)}
document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.tab)));
const mine=()=>profile?data.appointments.filter(a=>{const p=data.patients.find(p=>p.id===a.patientId);return p&&digits(p.phone)===digits(profile.phone)&&digits(p.phone).length>=10}).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)):[];
function patient(){if(!profile)return null;return data.patients.find(p=>digits(p.phone)===digits(profile.phone)&&digits(p.phone).length>=10)||null}
function ensurePatient(){let p=patient();if(!p){p={id:uid(),name:profile.name,phone:profile.phone,email:profile.email||'',birth:'',notes:''};data.patients.push(p)}else{p.name=profile.name;p.email=profile.email||p.email}return p}
const available=()=>{if(!booking.date||booking.date<dateISO()||new Date(booking.date+'T12:00:00').getDay()===0)return[];const hours=['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00'];return hours.filter(time=>(booking.date!==dateISO()||new Date(booking.date+'T'+time)>new Date())&&!data.appointments.some(a=>a.date===booking.date&&a.time===time&&a.status!=='cancelada'))};
function render(){data=read(DATA_KEY)||data;document.getElementById('app').innerHTML=tab==='inicio'?home():tab==='agendar'?schedule():tab==='consultas'?consultations():account();bind()}
function demoNotice(){return '<div class="demo">⚠️ <b>Ambiente acadêmico demonstrativo.</b> Os dados ficam somente neste navegador. Não use informações reais de pacientes. Horários e serviços são fictícios.</div>'}
function home(){let next=mine().find(a=>a.date>=dateISO()&&a.status!=='cancelada'&&a.status!=='concluida');return `<section class="hero"><div><div class="eyebrow">Seu sorriso em boas mãos</div><h1>${profile?'Olá, '+esc(profile.name.split(' ')[0])+'!':'Cuidar do seu sorriso ficou mais simples.'}</h1><p>Marque consultas, acompanhe seus agendamentos e organize seu cuidado odontológico em poucos passos.</p><button class="button" onclick="go('agendar')" style="margin-top:22px">Agendar consulta →</button></div><div class="hero-illustration">🦷</div></section><div class="grid"><section class="card"><h2>Nossos atendimentos</h2><p>Escolha o serviço ideal para você.</p><div class="services">${procedures.map(p=>`<div class="service"><div class="ico">${p.icon}</div><div><b>${p.name}</b><small>${p.description}</small></div></div>`).join('')}</div></section><aside class="card"><h2>${next?'Próxima consulta':'Seu atendimento'}</h2>${next?`<p>Você tem uma consulta marcada.</p><div class="info"><b>${esc(next.procedure)}</b><div>${formatDate(next.date)} às ${esc(next.time)}</div></div><button class="button outline full" style="margin-top:16px" onclick="go('consultas')">Ver minhas consultas</button>`:`<p>Agende sua próxima consulta de forma prática.</p><div class="info">✔ Escolha o procedimento<br>✔ Selecione data e horário<br>✔ Acompanhe pelo portal</div><button class="button full" style="margin-top:16px" onclick="go('agendar')">Agendar agora</button>`}<div style="margin-top:17px"><div class="mini-info"><span class="i">📍</span><span>${esc(data.clinic||'Clínica Sorriso')} — unidade de demonstração</span></div><div class="mini-info"><span class="i">🕘</span><span>Horários fictícios de seg. a sáb.</span></div></div></aside></div>${demoNotice()}`}
function schedule(){const times=available();if(booking.time&&!times.includes(booking.time))booking.time='';return `<div class="pagehead"><h1>Agendar consulta</h1><p>Selecione o atendimento, a data e o horário desejados.</p></div><div class="steps"><div class="step on"></div><div class="step on"></div><div class="step on"></div></div><div class="layout"><section class="card"><div class="fieldgroup"><label for="procedure">Tipo de atendimento</label><select id="procedure" class="field">${procedures.map(p=>`<option ${booking.procedure===p.name?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="fieldgroup"><label for="date">Data da consulta</label><input type="date" id="date" class="field" min="${dateISO()}" max="${dateISO(90)}" value="${esc(booking.date)}"></div><div class="fieldgroup"><label>Horários disponíveis</label>${new Date(booking.date+'T12:00:00').getDay()===0?'<p>Não há atendimento demonstrativo aos domingos.</p>':times.length?`<div class="slots">${times.map(t=>`<button type="button" data-time="${t}" class="slot ${booking.time===t?'selected':''}">${t}</button>`).join('')}</div>`:'<p>Não há horários disponíveis nesta data. Escolha outro dia.</p>'}</div><div class="info">Os horários exibidos são simulados. Uma reserva neste protótipo não é enviada a uma clínica real.</div></section><aside class="card summary"><h2>Resumo do agendamento</h2><div class="summary-row"><span>Clínica</span><b>${esc(data.clinic||'Clínica Sorriso')}</b></div><div class="summary-row"><span>Procedimento</span><b>${esc(booking.procedure)}</b></div><div class="summary-row"><span>Data</span><b>${booking.date?formatDate(booking.date):'—'}</b></div><div class="summary-row"><span>Horário</span><b>${esc(booking.time||'Selecione')}</b></div><button id="continue" class="button full" style="margin-top:23px" ${booking.time?'':'disabled'}>Continuar →</button></aside></div>${demoNotice()}`}
function consultations(){return `<div class="pagehead"><h1>Minhas consultas</h1><p>Consulte e gerencie seus agendamentos.</p></div>${!profile?`<section class="card form-panel"><h2>Identifique-se para continuar</h2><p>Cadastre seus dados de demonstração para acessar suas consultas.</p><button class="button" onclick="go('perfil')">Criar perfil demonstrativo</button></section>`:`<section class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2>Agendamentos de ${esc(profile.name)}</h2><button class="button sm" onclick="go('agendar')">+ Nova consulta</button></div>${mine().length?mine().map(a=>`<div class="appt"><div class="datebox"><strong>${esc(a.date.split('-')[2])}</strong><small>${formatDate(a.date,{month:'short'})}</small></div><div class="appt-main"><strong>${esc(a.procedure)}</strong><small>${formatDate(a.date)} · ${esc(a.time)} · ${esc(data.clinic)}</small><span class="pill ${esc(a.status)}">${({agendada:'Agendada',confirmada:'Confirmada',concluida:'Concluída',cancelada:'Cancelada'})[a.status]||esc(a.status)}</span></div>${a.status!=='cancelada'&&a.status!=='concluida'&&a.date>=dateISO()?`<button class="button danger sm" onclick="cancelAppointment('${esc(a.id)}')">Cancelar</button>`:''}</div>`).join(''):`<div class="empty"><div class="icon">📅</div><p>Você ainda não tem consultas cadastradas.</p><button class="button" onclick="go('agendar')">Marcar consulta</button></div>`}</section>`}${demoNotice()}`}
function account(){return `<div class="pagehead"><h1>Meu perfil</h1><p>Dados fictícios para identificar seus agendamentos neste dispositivo.</p></div><section class="card form-panel"><h2>${profile?'Atualizar meus dados':'Criar perfil demonstrativo'}</h2><p>Preencha os campos para continuar.</p><form id="profileForm"><div class="fieldgroup"><label for="name">Nome completo *</label><input id="name" name="name" class="field" maxlength="100" minlength="3" required placeholder="Ex.: Maria da Silva" value="${esc(profile?.name||'')}"></div><div class="fieldgroup"><label for="phone">Celular de demonstração *</label><input id="phone" name="phone" class="field" type="tel" inputmode="numeric" maxlength="20" required placeholder="(14) 99999-0000" value="${esc(profile?.phone||'')}"></div><div class="fieldgroup"><label for="email">E-mail (opcional)</label><input id="email" name="email" class="field" type="email" maxlength="100" placeholder="nome@exemplo.com" value="${esc(profile?.email||'')}"></div><button class="button full" type="submit">Salvar perfil</button></form>${profile?'<button class="button outline full" style="margin-top:12px" onclick="leaveProfile()">Trocar paciente demonstrativo</button>':''}</section>${demoNotice()}`}
function bind(){if(tab==='agendar'){document.getElementById('procedure').onchange=e=>{booking.procedure=e.target.value;render()};document.getElementById('date').onchange=e=>{booking.date=e.target.value;booking.time='';render()};document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{booking.time=b.dataset.time;render()});document.getElementById('continue').onclick=()=>{if(!booking.time)return;if(!profile){toast('Primeiro, preencha seu perfil para confirmar a consulta.');go('perfil');return}confirmBooking()}}if(tab==='perfil')document.getElementById('profileForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('name')).trim(),phone=String(f.get('phone')).trim(),email=String(f.get('email')).trim();if(name.length<3||digits(phone).length<10||digits(phone).length>13){toast('Informe um nome e telefone válidos para a demonstração.');return}if(profile&&digits(profile.phone)!==digits(phone)&&mine().length&&!confirm('Alterar o telefone fará o perfil deixar de exibir as consultas do número anterior. Continuar?'))return;profile={name,phone,email};try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profile))}catch{toast('Não foi possível guardar o perfil.');return}toast('Perfil salvo com sucesso.');go(booking.time?'agendar':'inicio')}}
function confirmBooking(){const availableNow=available();if(!availableNow.includes(booking.time)){toast('Horário indisponível. Escolha outro.');booking.time='';render();return}const p=ensurePatient();const a={id:uid(),patientId:p.id,date:booking.date,time:booking.time,procedure:booking.procedure,status:'agendada',notes:'Agendada pelo portal demonstrativo do paciente'};data.appointments.push(a);if(!persist()){data.appointments=data.appointments.filter(x=>x.id!==a.id);return}booking.time='';toast('Consulta demonstrativa agendada!');go('consultas')}
function cancelAppointment(id){const a=mine().find(a=>a.id===id);if(!a||a.status==='cancelada'||a.status==='concluida')return;if(!confirm('Deseja cancelar esta consulta demonstrativa?'))return;a.status='cancelada';persist();render();toast('Consulta cancelada.')}
function leaveProfile(){if(!confirm('Trocar de perfil demonstrativo neste navegador? As consultas salvas permanecerão no sistema.'))return;profile=null;localStorage.removeItem(PROFILE_KEY);booking.time='';go('perfil')}
window.addEventListener('storage',e=>{if(e.key===DATA_KEY)render()});render();
</script></body></html>
